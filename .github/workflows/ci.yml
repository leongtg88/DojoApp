name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valor dummy, sin credenciales reales (host local, sin contraseña). Prisma 7
  # resuelve `env('DIRECT_URL')` en prisma.config.ts durante el postinstall;
  # `prisma generate` no abre conexión a la base de datos.
  DIRECT_URL: postgresql://ci@localhost:5432/ci

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextfrontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # lee el campo packageManager (pnpm@10)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nextfrontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
